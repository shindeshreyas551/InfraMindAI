version: "3.9"

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: inframind_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inframind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inframind_secret}
      POSTGRES_DB: ${POSTGRES_DB:-inframind}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inframind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inframind_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: "InfraMind AI Backend API"
      API_V1_STR: "/api/v1"
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      REFRESH_TOKEN_EXPIRE_MINUTES: "10080"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-inframind}:${POSTGRES_PASSWORD:-inframind_secret}@db:5432/${POSTGRES_DB:-inframind}"
      BACKEND_CORS_ORIGINS: '["https://infra-mind-ai-three.vercel.app","http://localhost:3000","http://frontend:3000"]'
      RATE_LIMIT_PER_MINUTE: "10"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inframind_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: "https://inframindai.onrender.com/api/v1"
      NEXT_PUBLIC_WS_URL: "wss://inframindai.onrender.com/api/v1/ws"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    driver: local
